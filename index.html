<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[שם העסק]</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <h1>[שם העסק]</h1>
    <p class="tagline">[משפט אחד שמסביר מה העסק עושה]</p>
  </div>
</header>

<main>

  <section class="section about">
    <div class="container">
      <h2>קצת עלינו</h2>
      <p>[כאן תיכנס פסקה על העסק, בהתאם לתוכן שיועבר]</p>
    </div>
  </section>

  <section class="section hero-image">
    <div class="container">
      <div class="image-placeholder">
        <span>תמונה</span>
      </div>
    </div>
  </section>

  <section class="section details">
    <div class="container">
      <h2>פרטים מעשיים</h2>
      <div class="details-grid">
        <div class="details-item">
          <h3>מה יש</h3>
          <p>[להשלמה]</p>
        </div>
        <div class="details-item">
          <h3>מחירים</h3>
          <p>[להשלמה]</p>
        </div>
        <div class="details-item">
          <h3>שעות פעילות</h3>
          <p>[להשלמה]</p>
        </div>
        <div class="details-item">
          <h3>תהליך העבודה</h3>
          <p>[להשלמה]</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section contact-form">
    <div class="container">
      <h2>השאירו פרטים</h2>
      <form>
        <div class="form-group">
          <label for="name">שם מלא</label>
          <input type="text" id="name" name="name">
        </div>
        <div class="form-group">
          <label for="phone">טלפון</label>
          <input type="tel" id="phone" name="phone">
        </div>
        <div class="form-group">
          <label for="email">אימייל</label>
          <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
          <label for="message">הודעה חופשית</label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>
        <button type="submit">שליחה</button>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <h2>יצירת קשר</h2>
    <p>אימייל: <a href="mailto:alon@example.co.il">alon@example.co.il</a></p>
    <p>טלפון: [להשלמה]</p>
    <p>כתובת: [להשלמה]</p>
  </div>
</footer>

</body>
</html>
